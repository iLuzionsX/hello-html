name: OT Calculator Netlify

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: 22dc2a11-f5f1-48fe-b10f-5f4bf15712e1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify calculator files
        run: |
          test -f ot-calculator/index.html
          test -f ot-calculator/calculator.mjs
          test -f ot-calculator/calculator.test.mjs
          test -f ot-calculator/browser.test.mjs
          ls -la ot-calculator

      - name: Run calculation tests
        run: node --test ot-calculator/calculator.test.mjs

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real browser test
        run: |
          python3 -m http.server 4173 --directory ot-calculator > /tmp/ot-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.5
          done
          node ot-calculator/browser.test.mjs

      - name: Deploy to claimed Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::notice::NETLIFY_AUTH_TOKEN is not configured yet. Tests passed, but deployment was skipped."
            exit 0
          fi
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=ot-calculator \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --json | tee netlify-deploy.json

      - name: Show deploy result
        if: always()
        run: |
          if [ -f netlify-deploy.json ]; then
            cat netlify-deploy.json
          else
            echo "No deployment result. Add the NETLIFY_AUTH_TOKEN repository secret to enable permanent-site deploys."
          fi
